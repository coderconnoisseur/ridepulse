name: Publish demo image

# Publishes the one image the demo runs, so visitors can download it instead of
# building it. compose.yaml still builds locally if the image can't be pulled.
on:
  push:
    branches: [master]
    paths:
      - pkg/**
      - services/**
      - deployment/Dockerfile
      - .github/workflows/publish-image.yml

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      # amd64 and arm64, so it runs on Apple Silicon too.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/coderconnoisseur/ridepulse:latest
